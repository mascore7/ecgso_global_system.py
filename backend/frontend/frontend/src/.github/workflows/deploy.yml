name: CI/CD Pipeline - ECGSO Global System

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ==========================================
    # 1. SETUP & TEST PYTHON BACKEND
    # ==========================================
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # (Optional) Ku dar halkan tijaabooyinkaaga backend-ka haddii aad leedahay pytest
    # - name: Run Backend Tests
    #   run: pytest

    # ==========================================
    # 2. SETUP & BUILD REACT FRONTEND
    # ==========================================
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies & Build
      run: |
        cd frontend
        npm install
        npm run build
